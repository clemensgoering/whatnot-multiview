name: Release

# Builds installers for all three platforms and attaches them to a GitHub
# release. Trigger by pushing a version tag:  git tag v1.0.1 && git push --tags
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Icons live in build/ and are committed, so no display server is needed.
      - run: npm run ${{ matrix.script }}

      # latest*.yml is the manifest the in-app updater reads. Without it on the
      # release, checking for updates finds nothing at all.
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Lets anyone confirm a download is byte-for-byte what CI produced.
      - name: Generate checksums
        working-directory: artifacts
        run: |
          find . -type f -exec sha256sum {} + \
            | awk '{ name = $2; sub(/.*\//, "", name); print $1 "  " name }' \
            | sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            SHA256SUMS.txt
          generate_release_notes: true
